<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omega Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1f4068, #162447, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Common Glassmorphism Container Style */
        .glass-box {
            position: relative;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            margin: 20px;
            transition: all 0.5s ease;
        }

        /* Hidden Class */
        .hidden {
            display: none !important;
            opacity: 0;
            transform: scale(0.9);
        }

        /* Login Screen */
        .login-container h2 {
            font-size: 2rem;
            color: #fff;
            text-align: center;
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .login-subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 45px 15px 20px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            outline: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-group input:focus,
        .input-group input:valid {
            border-color: #00adb5;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 173, 181, 0.3);
        }

        .input-group i.field-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.1rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .input-group input:focus ~ i.field-icon,
        .input-group i.field-icon:hover {
            color: #00adb5;
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 0.8rem;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00adb5, #007991);
            border: none;
            outline: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(0, 173, 181, 0.4);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 173, 181, 0.6);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* Dashboard Screen */
        .dashboard-container {
            max-width: 500px;
            text-align: center;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .dashboard-header h2 {
            color: #fff;
            font-size: 1.5rem;
        }

        .logout-btn {
            background: rgba(255, 75, 75, 0.2);
            border: 1px solid rgba(255, 75, 75, 0.4);
            color: #ff6b6b;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 75, 75, 0.4);
            color: #fff;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .dash-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 20px 0;
            border-radius: 12px;
            color: #fff;
            font-size: 1.4rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dash-btn:hover {
            background: #00adb5;
            border-color: #00adb5;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 173, 181, 0.4);
        }

        .dash-btn i {
            display: block;
            font-size: 1rem;
            margin-top: 5px;
            color: rgba(255, 255, 255, 0.7);
        }

        .dash-btn:hover i {
            color: #fff;
        }

        .action-output {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 8px;
            color: #00adb5;
            font-size: 0.95krem;
            border: 1px dashed rgba(0, 173, 181, 0.3);
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .glass-box {
                padding: 25px;
            }
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div class="glass-box login-container" id="loginScreen">
        <h2>Omega Portal</h2>
        <p class="login-subtitle">Enter credentials to access dashboard</p>
        
        <form id="loginForm">
            <!-- Username Field -->
            <div class="input-group">
                <input type="text" id="username" required placeholder="Username (admin)">
                <i class="fa-solid fa-user field-icon"></i>
            </div>

            <!-- Password Field with Toggle -->
            <div class="input-group">
                <input type="password" id="password" required placeholder="Password (omega123)">
                <i class="fa-solid fa-eye-slash field-icon" id="togglePassword"></i>
            </div>

            <div class="error-msg" id="errorMsg">Invalid username or password!</div>

            <!-- Submit Button -->
            <button type="submit" class="login-btn">Login to Dashboard</button>
        </form>
    </div>

    <!-- DASHBOARD SCREEN (Hidden Initially) -->
    <div class="glass-box dashboard-container hidden" id="dashboardScreen">
        <div class="dashboard-header">
            <h2><i class="fa-solid fa-chart-pie" style="color: #00adb5;"></i> Omega Panel</h2>
            <button class="logout-btn" id="logoutBtn"><i class="fa-solid fa-power-off"></i> Logout</button>
        </div>

        <div class="button-grid">
            <button class="dash-btn" onclick="handleDashClick(1)">1 <i>Analytics</i></button>
            <button class="dash-btn" onclick="handleDashClick(2)">2 <i>Users</i></button>
            <button class="dash-btn" onclick="handleDashClick(3)">3 <i>Security</i></button>
            <button class="dash-btn" onclick="handleDashClick(4)">4 <i>Database</i></button>
            <button class="dash-btn" onclick="handleDashClick(5)">5 <i>Logs</i></button>
            <button class="dash-btn" onclick="handleDashClick(6)">6 <i>Settings</i></button>
        </div>

        <div class="action-output" id="actionOutput">
            Select a module button above to run action.
        </div>
    </div>

    <script>
        // Password Visibility Toggle Logic
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        // Login Authentication & Screen Switching Logic
        const loginForm = document.getElementById('loginForm');
        const loginScreen = document.getElementById('loginScreen');
        const dashboardScreen = document.getElementById('dashboardScreen');
        const errorMsg = document.getElementById('errorMsg');
        const logoutBtn = document.getElementById('logoutBtn');

        loginForm.addEventListener('submit', function (e) {
            e.preventDefault();
            const userInput = document.getElementById('username').value.trim();
            const passInput = document.getElementById('password').value.trim();

            // Check Hardcoded Credentials
            if (userInput === 'admin' && passInput === 'omega123') {
                errorMsg.style.display = 'none';
                
                // Smooth transition effect
                loginScreen.classList.add('hidden');
                setTimeout(() => {
                    loginScreen.style.display = 'none';
                    dashboardScreen.style.display = 'block';
                    setTimeout(() => {
                        dashboardScreen.classList.remove('hidden');
                    }, 50);
                }, 400);

                // Clear fields for security
                loginForm.reset();
            } else {
                errorMsg.style.display = 'block';
            }
        });

        // Logout Logic
        logoutBtn.addEventListener('click', function () {
            dashboardScreen.classList.add('hidden');
            setTimeout(() => {
                dashboardScreen.style.display = 'none';
                loginScreen.style.display = 'block';
                setTimeout(() => {
                    loginScreen.classList.remove('hidden');
                }, 50);
            }, 400);
            document.getElementById('actionOutput').innerText = "Select a module button above to run action.";
        });

        // Dashboard Interactive Button Actions
        function handleDashClick(num) {
            const output = document.getElementById('actionOutput');
            const messages = {
                1: "📊 Analytics module loaded successfully. Traffic looks steady.",
                2: "👥 User management portal active. 1,420 active accounts found.",
                3: "🛡️ Security firewall is fully operational. No threats detected.",
                4: "🗄️ Database status: Connected (Latency: 14ms).",
                5: "📜 System audit logs updated. No critical errors recorded.",
                6: "⚙️ Settings panel unlocked. System parameters are default."
            };
            output.innerText = messages[num] || `Module ${num} executed successfully!`;
        }
    </script>

</body>
</html>
